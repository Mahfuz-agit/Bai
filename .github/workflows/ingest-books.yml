name: Build Book Knowledge
on:
  workflow_dispatch:
  push:
    paths:
      - "books/**/*.pdf"
      - "books/*.pdf"
      - "app/knowledge/**"
      - "app/books/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Build knowledge library
        run: python -m app.knowledge.pipeline --input books --output data/library
      - name: Commit knowledge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library
          git diff --cached --quiet || git commit -m "Build book knowledge [skip ci]"
          git push || true
