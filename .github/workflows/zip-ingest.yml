name: Expand Project ZIP

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find newest ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -type f -iname '*.zip' ! -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$zip_file" ]; then
            echo "No ZIP file found."
            exit 1
          fi
          echo "Using: $zip_file"
          echo "file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Expand project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/project_extract
          mkdir -p /tmp/project_extract
          unzip -q -o "${{ steps.zip.outputs.file }}" -d /tmp/project_extract

          # Flatten a single outer folder, if the ZIP has one.
          shopt -s dotglob nullglob
          entries=(/tmp/project_extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          else
            source_dir="/tmp/project_extract"
          fi

          # Keep Git metadata and the uploaded ZIP, replace the project itself.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '*.zip' \
            -exec rm -rf {} +

          # Copy the complete project, including .github/workflows/.
          rsync -a \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            "$source_dir/" ./

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand project archive [skip ci]" || echo "No changes to commit."
          git push
