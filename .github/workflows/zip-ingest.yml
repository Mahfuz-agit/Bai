name: Expand Project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$zip_file"
          echo "path=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Extract and replace project
        env:
          ZIP_FILE: ${{ steps.zip.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$tmp"

          shopt -s dotglob nullglob
          entries=("$tmp"/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="$tmp"
          fi

          keep="$(mktemp)"
          cp .github/workflows/zip-ingest.yml "$keep"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          find .github/workflows -mindepth 1 -maxdepth 1 \
            ! -name "zip-ingest.yml" \
            -exec rm -rf {} +

          cp -a "$src"/. .

          cp "$keep" .github/workflows/zip-ingest.yml

          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          rm -rf "$tmp" "$keep"

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Expand project archive [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
